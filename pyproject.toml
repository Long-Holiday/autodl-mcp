[project]
name = "autodl-mcp"
version = "0.1.0"
description = "MCP server for ordinary AutoDL console instances"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx2>=2.10,<3", "python-dotenv>=1.0,<2"]

[project.scripts]
autodl-mcp = "autodl_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
